appId: com.voluntapp.app
name: Login exitoso de una cuenta de personal
# Requiere el backend encendido y las credenciales de una cuenta real:
# maestro test -e TEST_EMAIL=admin@bamx.test -e TEST_PASSWORD=... .maestro/login_success.yaml
---
- launchApp:
    clearState: true

# clearState borra los datos de la app, así que el development build abre el
# launcher de expo-dev-client en vez del bundle. Si aparece, entramos por el
# servidor de Metro que lista; con un build de release el bloque se omite.
- runFlow:
    when:
      visible: "(?i).*development build.*"
    commands:
      # El launcher tarda un momento en descubrir Metro en la red local.
      - extendedWaitUntil:
          visible: ".*:8081.*"
          timeout: 30000
      - tapOn: ".*:8081.*"

# Descargar el bundle y restaurar la sesión (vacía tras clearState) tarda,
# así que la pantalla de login puede aparecer con retraso.
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 90000

- tapOn:
    id: "login-email-input"
- inputText: ${TEST_EMAIL}

- tapOn:
    id: "login-password-input"
- inputText: ${TEST_PASSWORD}

- hideKeyboard

- tapOn:
    id: "login-submit-button"

# El login llama a la API y el stack protegido cambia a (tabs) al recibir la
# sesión; esperar por el contenedor de Inicio cubre esa latencia de red.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- assertVisible:
    id: "home-greeting"

# La barra es nativa: NativeTabs.Trigger no acepta testID, así que la pestaña
# se toca por su etiqueta del sistema, la única propiedad que expone.
- tapOn: "Ajustes"

- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000

- assertVisible:
    id: "settings-account-section"
